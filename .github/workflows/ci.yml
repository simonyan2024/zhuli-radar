name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import check
        run: |
          python -c "from server.main import app; from server.analyze import analyze_index; print('import ok')"

      - name: Boot server smoke
        run: |
          python -m uvicorn server.main:app --host 127.0.0.1 --port 8765 &
          sleep 3
          curl -sf http://127.0.0.1:8765/api/health
          curl -sf -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8765/
